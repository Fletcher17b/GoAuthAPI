services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      DB_HOST: db
      POSTGRES_DB: authDB
      POSTGRES_USER: auth_db
      POSTGRES_PASSWORD: auth_db123
    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_db -d authDB"]
      interval: 5s
      timeout: 5s
      retries: 10

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - backend

    mem_limit: 2g

  mailservice:
    build:
      context: https://github.com/Fletcher17b/EmailMicroService.git
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.mailservice
    networks:
      - backend
      - rabbitmq-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 1g

  authapi:
    build:
      context: .
      dockerfile: Dockerfile
    image: authapi:latest
    restart: on-failure
    expose:
      - "8081"
    env_file:
      - .env.compose
    volumes:
      - ./creds:/app/creds:ro
    depends_on:
      - db
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend
      - api-gateway
      - rabbitmq-network
    secrets:
      - authapi_private_key
      - authapi_public_key
    mem_limit: 1g


  redis:
    container_name: ratelimit_cache
    image: redis:8.2-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save "" --appendonly no
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend
    



secrets:
  authapi_private_key:
    file: ./creds/private.pem
  authapi_public_key:
    file: ./creds/public.pem


volumes:
  postgres_data:
  redis_data:
    driver: local

networks:
  backend:
    name: authapi-compose-backend
    driver: bridge
  api-gateway:
    name: api-gateway
    driver: bridge
    external: true
  rabbitmq-network:
    name: rabbitmq-network
    driver: bridge
    external: true
