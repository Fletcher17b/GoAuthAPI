version: "2"

run:
  tests: true
  timeout: 5m

linters:
  disable-all: true
  enable:
    - errcheck
    - staticcheck
    - govet
    - unused
    - ineffassign
    - gosec

  settings:
    gosec:
      severity: low
      excludes:
        - G104

formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true

issues:
  exclude-use-default: false