user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    #include /etc/nginx/conf.d/*.conf;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    limit_req_zone $binary_remote_addr zone=login_limit:10m   rate=10r/s;
    limit_req_zone $binary_remote_addr zone=signup_limit:10m  rate=5r/s;
    limit_req_zone $binary_remote_addr zone=reset_limit:10m   rate=3r/m;
    limit_req_zone $binary_remote_addr zone=refresh_limit:10m rate=30r/m;

    limit_req_status 429;  

    
    server {
        listen 80;
        server_name rabbitmq.service.local;

        location / {
            proxy_pass http://rabbitmq:15672;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }

    upstream authapi {
        least_conn;
        server authapi:8081 max_fails=1 fail_timeout=2s; 
        
    }

    server {
        listen 80;
        server_name authapi.dev;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        location /auth {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://authapi;
        }

        location = /auth/login {
            limit_req zone=login_limit burst=5 nodelay;
            proxy_pass http://authapi;
        }

        location = /auth/signup {
            limit_req zone=signup_limit burst=3 nodelay;
            proxy_pass http://authapi;
        }

        location = /auth/password/reset/request {
            limit_req zone=reset_limit burst=2 nodelay;
            proxy_pass http://authapi;
        }

        location = /auth/refresh {
            limit_req zone=refresh_limit burst=10 nodelay;
            proxy_pass http://authapi;
        }

        location /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

    
    }
}

stream {
    upstream rabbitmq_amqp {
        server rabbitmq:5672;
    }

    server {
        listen 5672;

        proxy_pass rabbitmq_amqp;

        proxy_connect_timeout 5s;
        proxy_timeout 60m;
    }
}
        